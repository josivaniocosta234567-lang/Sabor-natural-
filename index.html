<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabor Natural</title>
<style>
body{font-family:Arial;background:#F3F3F3;margin:0}
header{background:#6A1B9A;color:#fff;padding:20px;text-align:center}
.card{background:#fff;margin:12px;padding:15px;border-radius:14px}
h2{color:#6A1B9A}
select{width:100%;padding:12px;margin:8px 0}
button{width:100%;padding:14px;background:#25D366;color:#fff;border:none;border-radius:10px}
</style>
</head>
<body>

<header>
<h1>Sabor Natural Açaíteria</h1>
<p>Monte seu açaí 🍓</p>
</header>

<div class="card">
<h2>Fruta</h2>
<select id="frutas"></select>

<h2>Calda</h2>
<select id="caldas"></select>

<h2>Adicional</h2>
<select id="adicionais"></select>

<button>Enviar pedido no WhatsApp</button>
</div>

<script>
function carregar(id,chave){
let dados=JSON.parse(localStorage.getItem(chave)||"[]");
let s=document.getElementById(id);
s.innerHTML="";
dados.forEach(i=>{
let o=document.createElement("option");
o.text=i.nome||i;
s.add(o);
});
}
carregar("frutas","frutas");
carregar("caldas","caldas");
carregar("adicionais","adicionais");
</script>

</body>
</html>
