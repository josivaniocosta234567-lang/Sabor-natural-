<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sabor Natural</title>
<style>
body{margin:0;font-family:Arial;background:#f3f3f3}
header{background:#6A1B9A;color:#fff;text-align:center;padding:24px}
.card{background:#fff;margin:12px;padding:15px;border-radius:14px}
h3{color:#6A1B9A}
select{width:100%;padding:10px;margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{background:#eee;padding:8px;border-radius:8px}
button{width:100%;padding:14px;background:#25D366;color:#fff;border:0;border-radius:10px;font-size:16px}
</style>
</head>
<body>

<header>
<h2>🍇 Sabor Natural Açaíteria</h2>
<p>Monte seu açaí</p>
</header>

<div class="card">
<h3>Categoria</h3>
<select id="cat" onchange="carregar()">
<option>Marmita</option>
<option>Marmita + Cupuaçu</option>
<option>Copo</option>
</select>

<div id="sabores"></div>

<h3>Fruta</h3>
<select id="fruta">
<option>Banana</option>
<option>Morango</option>
<option>Uva</option>
<option>Manga</option>
<option>Kiwi</option>
</select>

<h3>Cobertura</h3>
<select id="cob">
<option>Chocolate</option>
<option>Morango</option>
<option>Caramelo</option>
<option>Uva</option>
</select>

<h3>Adicionais (até 3)</h3>
<div class="grid" id="adds"></div>

<br>
<button onclick="pedido()">Enviar pedido no WhatsApp</button>
</div>

<script>
const adicionais=["Leite em pó","Amendoim","Granola","Farinha láctea","Farinha de paçoca","Chocolate em gotas","M&M","Jujuba"];

function carregar(){
const s=document.getElementById("sabores");
if(cat.value=="Copo"){
s.innerHTML=`<h3>Tamanho</h3>
<select id="tam" onchange="copo()">
<option>330ml</option>
<option>400ml</option>
<option>500ml</option>
</select>
<div id="cp"></div>`;
copo();
}else{
s.innerHTML=`<h3>Sabor</h3>
<select id="sab">
<option value="15.99">Leite Condensado - R$15,99</option>
<option value="16.99">Creme Ninho - R$16,99</option>
<option value="16.99">Creme Nutella - R$16,99</option>
</select>`;
}
adds.innerHTML="";
adicionais.forEach(a=>adds.innerHTML+=`<label><input type="checkbox" value="${a}"> ${a}</label>`);
}

function copo(){
let h=`<h3>Sabor</h3><select id="sab">`;
if(tam.value=="330ml"){
h+=`<option value="15.99">Creme Ninho - R$15,99</option>
<option value="15.99">Creme Nutella - R$15,99</option>
<option value="14.99">Leite Condensado - R$14,99</option>`;
}
if(tam.value=="400ml"){
h+=`<option value="16.99">Creme Ninho - R$16,99</option>
<option value="16.99">Creme Nutella - R$16,99</option>
<option value="15.99">Leite Condensado - R$15,99</option>`;
}
if(tam.value=="500ml"){
h+=`<option value="19.99">Creme Ninho - R$19,99</option>
<option value="19.99">Creme Nutella - R$19,99</option>
<option value="18.99">Leite Condensado - R$18,99</option>`;
}
cp.innerHTML=h+"</select>";
}

function pedido(){
let texto="*🍇 SABOR NATURAL*%0A";
texto+="Categoria: "+cat.value+"%0A";
if(cat.value=="Copo") texto+="Tamanho: "+tam.value+"%0A";
texto+="Sabor: "+sab.options[sab.selectedIndex].text+"%0A";
texto+="Fruta: "+fruta.value+"%0A";
texto+="Cobertura: "+cob.value+"%0A";
let ad=[...document.querySelectorAll('input:checked')].map(x=>x.value).join(", ");
texto+="Adicionais: "+(ad||"Nenhum");
window.open("https://wa.me/5581999846140?text="+texto,"_blank");
}
carregar();
</script>

</body>
</html>
