<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabor Natural</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#5b21b6;color:#222}
.header{
background:linear-gradient(135deg,#6d28d9,#a21caf);
padding:28px 20px;
text-align:center;
color:#fff}
.header h1{font-size:32px}
.header p{opacity:.95}
.container{max-width:430px;margin:auto;padding:15px}
.card{
background:#fff;
border-radius:18px;
padding:18px;
margin-bottom:15px}
.titulo{
font-size:20px;
color:#6d28d9;
margin-bottom:12px;
font-weight:bold}
select{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
margin-top:8px}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:8px}
.item{
background:#f5f5f5;
padding:10px;
border-radius:10px;
font-size:14px}
.item input{margin-right:6px}
.total{
background:#ecfdf5;
border:2px solid #16a34a;
padding:15px;
border-radius:14px;
text-align:center}
.total span{
font-size:28px;
font-weight:bold;
color:#16a34a}
.btn{
width:100%;
padding:16px;
background:#16a34a;
color:#fff;
border:none;
border-radius:14px;
font-size:18px;
font-weight:bold;
margin-top:12px}
</style>
</head>

<body>

<div class="header">
<h1>🍇 SABOR NATURAL</h1>
<p>@sabor.natural86</p>
<p>WhatsApp (81) 99984-6140</p>
</div>

<div class="container">

<div class="card">
<div class="titulo">Monte seu Açaí</div>

<label>Categoria</label>
<select id="categoria">
<option value="marmita">Marmita de Açaí</option>
<option value="cupuacu">Açaí + Cupuaçu</option>
<option value="copo">Açaí no Copo</option>
</select>

<div id="boxTamanho" style="display:none;margin-top:10px">
<label>Tamanho do copo</label>
<select id="tamanho">
<option value="330">330ml</option>
<option value="400">400ml</option>
<option value="500">500ml</option>
</select>
</div>

<div style="margin-top:10px">
<label>Base</label>
<select id="base"></select>
</div>

</div>

<div id="opcoes"></div>

</div>
