
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabor Natural</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#f3f3f3;color:#222}
header{background:#6A1B9A;color:#fff;padding:22px;text-align:center}
header p{opacity:.9}
.container{padding:14px;max-width:500px;margin:auto}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
h2{color:#6A1B9A;margin-bottom:12px;font-size:22px}
label{font-weight:bold;display:block;margin:10px 0 5px}
select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.item{background:#eee;padding:8px;border-radius:8px;font-size:14px}
button{width:100%;padding:15px;border:none;border-radius:12px;background:#25D366;color:#fff;font-size:17px;font-weight:bold;margin-top:16px}
.obs{font-size:13px;color:#777;margin-top:6px}
</style>
</head>
<body>

<header>
<h1>🍇 Sabor Natural</h1>
<p>@sabor.natural86</p>
</header>

<div class="container">
<div class="card">
<h2>Monte seu pedido</h2>

<label>Categoria</label>
<select id="categoria" onchange="carregarSabores()">
<option value="marmita">Marmita de Açaí</option>
<option value="acaiCup">Marmita Açaí + Cupuaçu</option>
<option value="cupua">Marmita de Cupuaçu</option>
<option value="cupuaCopo">Cupuaçu no Copo 400ml</option>
<option value="copo">Açaí no Copo</option>
</select>

<div id="tamArea" style="display:none">
<label>Tamanho</label>
<select id="tamanho" onchange="carregarSabores()">
<option>330ml</option>
<option>400ml</option>
<option>500ml</option>
</select>
</div>

<label>Sabor</label>
<select id="sabor"></select>

<div class="obs" id="obs"></div>

<label>Fruta (1)</label>
<select id="fruta"></select>

<label>Cobertura (1)</label>
<select id="cobertura"></select>

<label>Adicionais</label>
<div class="grid" id="adicionais"></div>

<button onclick="enviar()">📲 Enviar Pedido</button>
</div>
</div>

<script>
//========================
// EDIÇÃO FÁCIL
//========================
const WHATSAPP="5581999846140";

const frutas=["Banana","Morango","Uva","Manga"];
const coberturas=["Chocolate","Morango","Caramelo","Uva"];
const adicionaisLista=[
"Leite em pó",
"Amendoim triturado",
"Granola",
"Farinha láctea",
"Farinha de paçoca",
"Chocolate gota chips",
"M&M",
"Jujuba"
];

const produtos={
marmita:[
{nome:"Leite Condensado",preco:12.99},
{nome:"Creme Ninho",preco:14.99},
{nome:"Creme de Nutella",preco:14.99}
],
acaiCup:[
{nome:"Açaí + Cupuaçu Leite Condensado",preco:13.99},
{nome:"Açaí + Cupuaçu Creme Ninho",preco:15.99},
{nome:"Açaí + Cupuaçu Creme de Nutella",preco:15.99}
],
cupua:[
{nome:"Cupuaçu/Creme ninho - marmita",preco:16.99},
{nome:"Cupuaçu/Creme de Nutella - marmita",preco:16.99},
{nome:"Cupuaçu/Leite condensado - marmita",preco:15.99}
],
cupuaCopo:[
{nome:"Cupuaçu/Creme ninho - copo 400ml",preco:16.99},
{nome:"Cupuaçu/Creme de Nutella - copo 400ml",preco:16.99},
{nome:"Cupuaçu/Leite condensado - copo 400ml",preco:15.99}
],
copo:{
"330ml":[
{nome:"Leite Condensado",preco:10.99},
{nome:"Creme Ninho",preco:12.99},
{nome:"Creme de Nutella",preco:12.99}
],
"400ml":[
{nome:"Leite Condensado",preco:12.99},
{nome:"Creme Ninho",preco:14.99},
{nome:"Creme de Nutella",preco:14.99}
],
"500ml":[
{nome:"Leite Condensado",preco:15.99},
{nome:"Creme Ninho",preco:16.99},
{nome:"Creme de Nutella",preco:16.99}
]
}
};

const fruta=document.getElementById("fruta");
const cobertura=document.getElementById("cobertura");
const adicionais=document.getElementById("adicionais");
const sabor=document.getElementById("sabor");
const obs=document.getElementById("obs");

frutas.forEach(f=>fruta.innerHTML+=`<option>${f}</option>`);
coberturas.forEach(c=>cobertura.innerHTML+=`<option>${c}</option>`);
adicionaisLista.forEach(a=>{
adicionais.innerHTML+=`<label class="item"><input type="checkbox" value="${a}"> ${a}</label>`;
});

function carregarSabores(){
const cat=categoria.value;
tamArea.style.display=cat==="copo"?"block":"none";
sabor.innerHTML="";
let lista=[];

if(cat==="copo"){
lista=produtos.copo[tamanho.value];
}else{
lista=produtos[cat];
}

lista.forEach(p=>{
sabor.innerHTML+=`<option value="${p.preco}">${p.nome} - R$ ${p.preco.toFixed(2).replace(".",",")}</option>`;
});

if(cat==="copo"){
obs.innerText=tamanho.value==="500ml"?
"Inclui 4 adicionais • 1 fruta • 1 cobertura":
"Inclui 3 adicionais • 1 fruta • 1 cobertura";
}else{
obs.innerText="Inclui 3 adicionais • 1 fruta • 1 cobertura";
}
}

function enviar(){
const marcados=[...document.querySelectorAll("input[type=checkbox]:checked")];
let limite=3;
if(categoria.value==="copo"&&tamanho.value==="500ml")limite=4;

if(marcados.length>limite){
alert("Escolha no máximo "+limite+" adicionais.");
return;
}

let msg=`🍇 *SABOR NATURAL*%0A%0A`;
msg+=`*Categoria:* ${categoria.options[categoria.selectedIndex].text}%0A`;

if(categoria.value==="copo"){
msg+=`*Tamanho:* ${tamanho.value}%0A`;
}

msg+=`*Produto:* ${sabor.options[sabor.selectedIndex].text}%0A`;
msg+=`*Fruta:* ${fruta.value}%0A`;
msg+=`*Cobertura:* ${cobertura.value}%0A`;
msg+=`*Adicionais:* ${marcados.map(x=>x.value).join(", ")||"Nenhum"}%0A`;
msg+=`*Instagram:* @sabor.natural86`;

window.open(`https://wa.me/${WHATSAPP}?text=${msg}`,"_blank");
}

carregarSabores();
</script>

</body>
</html>
