<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabor Natural</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#6d28d9;color:#222}
.topo{background:linear-gradient(135deg,#6d28d9,#a21caf);padding:25px;color:#fff;text-align:center}
.card{background:#fff;margin:15px;border-radius:18px;padding:18px}
h2{margin-bottom:10px;color:#6d28d9}
select{width:100%;padding:12px;border-radius:10px;margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{background:#f3f3f3;padding:8px;border-radius:8px;font-size:14px}
.total{font-size:22px;font-weight:bold;text-align:center;color:#16a34a}
button{width:100%;padding:15px;border:none;border-radius:12px;background:#16a34a;color:#fff;font-size:18px;font-weight:bold}
</style>
</head>
<body>

<div class="topo">
<h1>🍇 SABOR NATURAL</h1>
<p>@sabor.natural86</p>
<p>WhatsApp: (81) 99984-6140</p>
</div>

<div class="card">
<h2>Monte seu Açaí</h2>

<select id="categoria">
<option value="marmita">Marmita</option>
<option value="cupuacu">Açaí + Cupuaçu</option>
<option value="copo">Copo</option>
</select>

<div id="tamBox" style="display:none">
<select id="tamanho">
<option>330ml</option>
<option>400ml</option>
<option>500ml</option>
</select>
</div>

<select id="base"></select>

<h3>Fruta</h3>
<div class="grid" id="frutas"></div>

<h3>Cobertura</h3>
<div class="grid" id="cob"></div>

<h3>Adicionais</h3>
<div class="grid" id="add"></div>

<br>
<div class="total" id="valor">R$ 12,99</div>
<br>
<button onclick="enviar()">FINALIZAR PEDIDO</button>

</div>

<script>
const WPP="5581999846140";

const frutas=["Banana","Morango","Uva","Manga"];
const cob=["Chocolate","Morango","Caramelo","Uva"];
const adds=["Leite em pó","Amendoim","Granola","Farinha láctea","Paçoca","Chips","M&M","Jujuba"];

const dados={
marmita:[
["Leite Condensado",12.99],
["Creme Ninho",14.99],
["Creme Nutella",14.99]],
cupuacu:[
["Leite Condensado",13.99],
["Creme Ninho",15.99],
["Creme Nutella",15.99]],
copo:{
"330ml":[["Leite Condensado",10.99],["Creme Ninho",12.99],["Creme Nutella",12.99]],
"400ml":[["Leite Condensado",12.99],["Creme Ninho",14.99],["Creme Nutella",14.99]],
"500ml":[["Leite Condensado",15.99],["Creme Ninho",16.99],["Creme Nutella",16.99]]
}
};

function lista(id,itens,tipo){
let h="";
itens.forEach(x=>h+=`<label><input type="${tipo}" name="${id}" value="${x}"> ${x}</label>`);
document.getElementById(id).innerHTML=h;
}
lista("frutas",frutas,"radio");
lista("cob",cob,"radio");
lista("add",adds,"checkbox");

function atualizar(){
let c=categoria.value;
tamBox.style.display=c=="copo"?"block":"none";
let op=c=="copo"?dados.copo[tamanho.value]:dados[c];
base.innerHTML="";
op.forEach((x,i)=>base.innerHTML+=`<option value="${i}">${x[0]} - R$ ${x[1].toFixed(2).replace(".",",")}</option>`);
valor.innerHTML="R$ "+op[0][1].toFixed(2).replace(".",",");
}
categoria.onchange=atualizar;
tamanho.onchange=atualizar;
base.onchange=()=>{let o=categoria.value=="copo"?dados.copo[tamanho.value]:dados[categoria.value];valor.innerHTML="R$ "+o[base.value][1].toFixed(2).replace(".",",");};
atualizar();

function enviar(){
let fruta=document.querySelector('input[name=frutas]:checked');
let cobertura=document.querySelector('input[name=cob]:checked');
if(!fruta||!cobertura){alert("Escolha fruta e cobertura");return;}
let ad=[...document.querySelectorAll('input[name=add]:checked')].map(x=>x.value);
let lim=tamanho.value=="500ml"?4:3;
if(ad.length>lim){alert("Máximo "+lim+" adicionais");return;}
let op=categoria.value=="copo"?dados.copo[tamanho.value]:dados[categoria.value];
let item=op[base.value];
let msg=`🍇 *SABOR NATURAL*%0A%0A📦 ${categoria.value}%0A`;
if(categoria.value=="copo")msg+=`🥤 ${tamanho.value}%0A`;
msg+=`🍧 ${item[0]}%0A🍓 ${fruta.value}%0A🍯 ${cobertura.value}%0A🥜 ${ad.join(", ")}%0A💰 R$ ${item[1].toFixed(2).replace(".",",")}`;
window.open(`https://wa.me/${WPP}?text=${msg}`,"_blank");
}
</script>

</body>
</html>
